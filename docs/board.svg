<svg xmlns="http://www.w3.org/2000/svg" width="744" height="906" viewBox="0 0 744 906" font-family="'Cascadia Mono','Consolas','Menlo','Noto Sans Mono CJK JP','MS Gothic',monospace" font-size="15">
<rect width="744" height="906" rx="10" fill="#0d1117"/>
<circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="66" cy="20" r="6" fill="#27c93f"/>
<text x="372" y="25" text-anchor="middle" fill="#8b949e" font-size="13">ボードを開いた状態</text>
<text x="20" y="50" fill="#58a6ff">[閉じる]</text>
<text x="20" y="72" fill="#e6edf3" font-weight="bold">意図の読み</text>
<text x="38" y="94" fill="#8b949e">「Claude が自分の意図をどう汲み取っているのか、会話しながら見たい」</text>
<text x="38" y="116" fill="#e6edf3" font-weight="bold">Claude の意図の読みを会話中に見せ、ずれを見つけられるようにする</text>
<text x="38" y="138" fill="#e6edf3">・いま扱っている問い：帯を常に出してうるさくないか</text>

<text x="20" y="182" fill="#f85149" font-weight="bold">監査の指摘（1）</text>
<text x="38" y="204" fill="#f85149">・食い違い：意図の読みがずれているかもしれない：「作業の前後は問わない」に</text>
<text x="56" y="226" fill="#f85149">直ったのに、返信はまだ作業を始める前の確認を求めている</text>

<text x="20" y="270" fill="#e6edf3" font-weight="bold">流れ</text>
<text x="38" y="292" fill="#e6edf3">・1. 帯に意図の読みと次の一歩を出す</text>
<text x="56" y="314" fill="#8b949e">会話を止めずに、読みのずれに気づける</text>
<text x="56" y="336" fill="#8b949e">← 目的・「読みは会話を止めずに見られるようにする」</text>
<text x="56" y="358" fill="#e3b341">文脈の補完：プロンプトの上に帯を常に出す（どこに出すかは言われていない。</text>
<text x="56" y="380" fill="#e3b341">常に目に入る場所を選んだ）</text>
<text x="38" y="402" fill="#e6edf3">・2. ボードに読み・流れ・決めることを並べる</text>
<text x="56" y="424" fill="#8b949e">読みがどこから来たかを確かめられる</text>
<text x="56" y="446" fill="#8b949e">← 目的</text>
<text x="56" y="468" fill="#e3b341">文脈の補完：詳しくはボタンで開くボードに分ける（帯に全部は載らないため）</text>
<text x="38" y="490" fill="#e6edf3">・3. 話しかけて読みを直せるようにする</text>
<text x="56" y="512" fill="#8b949e">ずれを見つけたらその場で直せる</text>
<text x="56" y="534" fill="#8b949e">← 目的・「細かい手順は任せる。意図が合っていればいい」</text>

<text x="20" y="578" fill="#e6edf3" font-weight="bold">あなたが決めること（1）</text>
<text x="38" y="600" fill="#e6edf3">・帯を常に出してうるさくないか</text>

<text x="20" y="644" fill="#e6edf3" font-weight="bold">▸ 決まったこと（3）</text>

<text x="20" y="688" fill="#e3b341" font-weight="bold">▸ 文脈の補完（2）</text>

<text x="20" y="732" fill="#e6edf3" font-weight="bold">▸ 置き換わったこと（1）</text>

<line x1="20" y1="769" x2="724" y2="769" stroke="#30363d"/>
<text x="20" y="798" fill="#e6edf3">意図：Claude の意図の読みを会話中に見せ、ずれを見つけられるようにする</text>
<text x="20" y="820" fill="#8b949e">次：帯に意図の読みと次の一歩を出す（ほか 2）   <tspan fill="#f85149">｜ 監査の指摘 1</tspan></text><text x="724" y="820" text-anchor="end" fill="#58a6ff">[ボードを閉じる]</text>
<line x1="20" y1="835" x2="724" y2="835" stroke="#30363d"/>
<text x="20" y="864" fill="#e6edf3">&gt; </text>
</svg>
